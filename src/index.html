<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dubsector.dev</title>
  <script>
    // Start the 3D view's downloads now, not when terminal.js and then
    // scene.js get round to asking. The test is GL_MODE's in terminal.js;
    // build.mjs fills in the list. Ahead of the style sheets, which would
    // otherwise hold this script up until they have loaded.
    (function () {
      var q = location.search;
      if (/[?&]gl=0(&|$)/.test(q)) return;
      if (!/[?&]gl=1(&|$)/.test(q)) {
        if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        if (navigator.connection && navigator.connection.saveData) return;
      }
      /*PRELOAD*/[].forEach(function (p) {
        var link = document.createElement("link");
        link.rel = "preload";
        link.as = p.as;
        if (p.as === "fetch") link.crossOrigin = "anonymous";
        link.href = p.href;
        document.head.appendChild(link);
      });
    })();
  </script>
  <!-- The shell is the largest script on the page and nothing runs without
       it: fetch it alongside terminal.js, which adds the tag that runs it. -->
  <link rel="preload" href="./shell.js" as="script">
  <link rel="stylesheet" href="./terminal.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
</head>
<body>
<div class="monitor">
  <div class="crt">
    <div id="terminal"></div>
    <div class="crt-flicker" aria-hidden="true"></div>
    <div class="crt-glass" aria-hidden="true"></div>
    <div class="crt-glitch" aria-hidden="true"></div>
  </div>
  <div class="power-control">
    <span class="power-led" id="powerLed"></span>
    <button class="power-btn" id="powerBtn" type="button" aria-label="Power"></button>
  </div>
</div>
<script src="./terminal.js"></script>
</body>
</html>
